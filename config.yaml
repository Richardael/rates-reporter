timezone: "America/Caracas"
round_decimals: 2

output:
  print_console: true
  save_to_file: true
  output_file: "latest-rates-message.txt"

callmebot:
  enabled: true
  recipients:
    - name: "Chayan"
      phone_env: "RATES_PHONE_CHAYAN"
      apikey_env: "RATES_APIKEY_CHAYAN"
    - name: "Richard"
      phone_env: "RATES_PHONE_RICHARD"
      apikey_env: "RATES_APIKEY_RICHARD"
    - name: "Mariu"
      phone_env: "RATES_PHONE_MARIU"
      apikey_env: "RATES_APIKEY_MARIU"
    - name: "Tahi"
      phone_env: "RATES_PHONE_TAHI"
      apikey_env: "RATES_APIKEY_TAHI"
    - name: "Paola"
      phone_env: "RATES_PHONE_PAOLA"
      apikey_env: "RATES_APIKEY_PAOLA"
    - name: "Irene"
      phone_env: "RATES_PHONE_IRENE"
      apikey_env: "RATES_APIKEY_IRENE"
    - name: "Sabrina"
      phone_env: "RATES_PHONE_SABRINA"
      apikey_env: "RATES_APIKEY_SABRINA"

rates:
  bcv_usd:
    enabled: false
    label: "BCV USD"
    provider: "dolarapi_usd_official"
    adjustments:
      percent_subtract: 0.0
      fixed_subtract_bs: 0.0

  bcv_eur:
    enabled: true
    label: "BCV EUR"
    provider: "dolarapi_eur_official"
    adjustments:
      percent_subtract: 0.0
      fixed_subtract_bs: 0.0

  binance_usdt:
    enabled: true
    label: "Binance USDT"
    provider: "binance_p2p"
    fallback_manual_rate: null
    binance:
      asset: "USDT"
      fiat: "VES"
      trade_type: "SELL"
      rows: 10
      pay_types: []
      aggregation: "median"
      merchant_check: false
    adjustments:
      percent_subtract: 0.2
      fixed_subtract_bs: 10.0
